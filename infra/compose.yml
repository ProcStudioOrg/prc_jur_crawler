# infra/compose.yml
services:
  jur:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: "${JUR_IMAGE:-jur:dev}"
    # Repassa sinais e recolhe filhos de Xvfb/Chromium; xvfb-run não deve ser PID 1.
    init: true
    # Publicação somente no proxy local; identidade validada pelo ProcStudio.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      JUR_DADOS: /dados
      TMPDIR: /cache
      JUR_CONCORRENCIA: "${JUR_CONCORRENCIA:-3}"
      # Tetos de admissao da fila (BRU-87); 0 desliga o teto. Ver infra/README.md.
      JUR_ATIVAS_POR_CONTA: "${JUR_ATIVAS_POR_CONTA:-12}"
      JUR_FILA_GLOBAL: "${JUR_FILA_GLOBAL:-30}"
      JUR_BUSCAS_POR_HORA: "${JUR_BUSCAS_POR_HORA:-60}"
      JUR_CAPTCHA_TIMEOUT_MS: "${JUR_CAPTCHA_TIMEOUT_MS:-120000}"
      # O provedor remoto só aparece quando as duas variáveis estão configuradas.
      BROWSERBASE_API_KEY: "${BROWSERBASE_API_KEY:-}"
      BROWSERBASE_PROJECT_ID: "${BROWSERBASE_PROJECT_ID:-}"
      # Navegadores remotos (servidor/navegadores/remotos.js): Kernel primeiro, Steel de
      # reserva. Com pelo menos uma chave, TRF3 e Falcão passam a usar o remoto.
      KERNEL_API_KEY: "${KERNEL_API_KEY:-}"
      STEEL_API_KEY: "${STEEL_API_KEY:-}"
      JUR_NAVEGADOR_REMOTO: "${JUR_NAVEGADOR_REMOTO:-kernel,steel}"
      JUR_CONCORRENCIA_REMOTA: "${JUR_CONCORRENCIA_REMOTA:-5}"
      # Aviso de deploy ao FFD (servidor/aviso-deploy.js). A revisão sai da tag da imagem.
      USAGE_WEBHOOK_URL: "${USAGE_WEBHOOK_URL:-}"
      JUR_IMAGE: "${JUR_IMAGE:-jur:dev}"
      # Dentro do container o bind precisa ser 0.0.0.0 para o Docker conseguir
      # encaminhar a porta publicada; quem limita a exposicao e o "127.0.0.1:" do
      # ports acima. Fora do container (node servidor/index.js) o default e 127.0.0.1.
      JUR_BIND: "0.0.0.0"
      JUR_ENCRYPTION_KEY: "${JUR_ENCRYPTION_KEY:?Configure JUR_ENCRYPTION_KEY}"
      JUR_PUBLIC_URL: "${JUR_PUBLIC_URL:?Configure JUR_PUBLIC_URL}"
      PROCSTUDIO_FRONTEND_URL: "${PROCSTUDIO_FRONTEND_URL:?Configure PROCSTUDIO_FRONTEND_URL}"
      PROCSTUDIO_API_URL: "${PROCSTUDIO_API_URL:?Configure PROCSTUDIO_API_URL}"
      PROCSTUDIO_ISSUER: "${PROCSTUDIO_ISSUER:?Configure PROCSTUDIO_ISSUER}"
      PROCSTUDIO_CLIENT_ID: "${PROCSTUDIO_CLIENT_ID:?Configure PROCSTUDIO_CLIENT_ID}"
      PROCSTUDIO_CLIENT_SECRET: "${PROCSTUDIO_CLIENT_SECRET:?Configure PROCSTUDIO_CLIENT_SECRET}"
      # JUR_BROWSER_ARGS: "--no-sandbox --disable-dev-shm-usage"   # so no nivel 3 — nao foi preciso (ver infra/README.md)
    volumes:
      - jur-dados:/dados
      - jur-cache:/cache
    # security_opt:                                                # so no nivel 2 — nao foi preciso (ver infra/README.md)
    #   - seccomp=./chrome-seccomp.json
    # 3 Chromium simultaneos ~ 900 MB, mais o Node. Abaixo de 2g o OOM killer aparece.
    mem_limit: "${JUR_MEM_LIMIT:-2g}"
    # Chromium usa /dev/shm; o default de 64 MB do Docker faz a aba morrer sozinha.
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  jur-dados:
  jur-cache:
