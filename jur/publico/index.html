<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jur — jurisprudência dos tribunais brasileiros</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body class="aguardando-sessao">
  <section id="login-procstudio" aria-label="Entrar no JurCrawler">
    <div class="login-conteudo"><span class="marca">ProcStudio <b>Jurisprudência</b></span>
    <h1>Pesquisa jurídica,<br>com a sua conta.</h1>
    <p>Consulte as bases oficiais dos tribunais e converse com a IA de sua escolha.</p>
    <a class="botao-acento entrar-procstudio" href="/auth/login">Entrar com ProcStudio <span aria-hidden="true">→</span></a>
    <p class="login-privacidade">Suas conexões de IA e pesquisas ficam privadas na sua conta.</p>
    <p id="login-erro" role="status"></p></div>
  </section>
  <!-- I4: abaixo de 860px a lateral vira gaveta. Sem este botao ela simplesmente sumia,
       e com ela iam Nova conversa, o historico e — o que bloqueia o produto —
       Configuracoes, o unico lugar da interface onde se digita a chave da Anthropic.
       O chat respondia "informe na interface" e nao havia caminho na tela para obedecer. -->
  <button id="abrir-lateral" class="abrir-lateral" aria-controls="lateral" aria-expanded="false"
          aria-label="Abrir menu">☰</button>
  <div id="fundo-lateral" class="fundo-lateral" aria-hidden="true"></div>

  <aside id="lateral">
    <div class="lateral-topo">
      <span class="marca">ProcStudio <b>Jurisprudência</b></span>
      <button id="tema" class="icone" title="Alternar tema" aria-label="Alternar tema">◐</button>
    </div>

    <button id="nova-conversa" class="botao-novo">
      <span aria-hidden="true">+</span> Nova conversa
    </button>

    <nav id="historico" aria-label="Conversas"></nav>

    <button id="abrir-config" class="config">
      <span class="config-avatar" aria-hidden="true">⚙</span>
      <span class="config-texto">
        <strong>Configurações</strong>
        <small>Provedores e integrações</small>
      </span>
    </button>
    <div class="conta-atual"><span id="conta-nome"></span><button id="sair-conta" type="button">Sair</button></div>
  </aside>

  <main id="centro">
    <section id="inicial">
      <h1 class="saudacao">Sobre o que você quer pesquisar?</h1>
      <div id="caixa-inicial" class="caixa-entrada"></div>
      <section id="prompts" aria-label="Modelos de prompt"></section>
      <section id="disponibilidade" aria-label="Disponibilidade dos tribunais"></section>
      <section id="manual" aria-label="Manual"></section>
    </section>

    <section id="conversa" hidden>
      <button id="abrir-decisoes" class="abrir-decisoes" type="button" hidden
              aria-controls="decisoes" aria-expanded="false"></button>
      <div id="mensagens" role="log" aria-live="polite"></div>
      <div id="caixa-conversa" class="caixa-entrada"></div>
    </section>
  </main>

  <!-- Painel das decisoes que a conversa leu. Em tela larga fica ancorado ao lado do
       centro; abaixo de 1100px vira gaveta sobreposta, como o drawer de intimacoes do
       ProcStudio. -->
  <div id="fundo-decisoes" class="fundo-decisoes" aria-hidden="true"></div>
  <aside id="decisoes" aria-label="Decisões consultadas" hidden></aside>

  <div id="painel-config" class="painel" hidden></div>
  <div id="painel-ressalva" class="painel" hidden></div>

  <template id="tpl-entrada">
    <form class="formulario">
      <textarea class="entrada" rows="1" placeholder="Pergunte sobre jurisprudência…"></textarea>
      <div class="entrada-rodape">
        <div class="seletor-modelo"></div>
        <button type="submit" class="enviar" aria-label="Enviar">↑</button>
      </div>
    </form>
  </template>

  <!-- markdown.js antes de app.js: `bolha()` consulta window.jurMarkdown ja na primeira
       resposta. app.js antes dos outros dois: ele define window.jurApi e window.jurUI,
       que eles consomem no carregamento (disponibilidade.js busca /api/v1/tribunais de
       imediato). -->
  <script src="/markdown.js"></script>
  <script src="/conexoes.js"></script>
  <script src="/seletor-modelo.js"></script>
  <script src="/app.js"></script>
  <script src="/disponibilidade.js"></script>
  <script src="/decisoes.js"></script>
  <script src="/config.js"></script>
  <script src="/sessao.js"></script>
</body>
</html>
