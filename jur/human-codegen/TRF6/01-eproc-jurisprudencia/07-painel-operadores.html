<div id="divOperadores" class="ml-2 mt-2" style="">
                        <button class="px-2 btn btn-sm btn-secondary" data-html="true" data-placement="top" data-toggle="tooltip" data-trigger="hover" onclick="adicionarOperador(' &quot; &quot;');" title="" type="button" data-original-title="Pesquisa documentos que contenham a expressão informada.&lt;br&gt;Ex.: &quot;faixa de fronteira&quot;">"..."</button>

                        <button class="px-2 btn btn-sm btn-secondary" data-html="true" data-placement="top" data-toggle="tooltip" data-trigger="hover" onclick="adicionarOperador(' e ');" title="" type="button" data-original-title="Pesquisa documentos que contenham todas as palavras ou expressões informadas.&lt;br&gt;Ex.: crime e &quot;faixa de fronteira&quot;">e</button>

                        <button class="px-2 btn btn-sm btn-secondary" data-html="true" data-placement="top" data-toggle="tooltip" data-trigger="hover" onclick="adicionarOperador(' ou ');" title="" type="button" data-original-title="Pesquisa documentos que contenham pelo menos uma das palavras ou expressões informadas.&lt;br&gt;Ex.: drogas ou entorpecentes">ou</button>

                        <button class="px-2 btn btn-sm btn-secondary" data-html="true" data-placement="top" data-toggle="tooltip" data-trigger="hover" onclick="adicionarOperador(' não ');" title="" type="button" data-original-title="Pesquisa documentos que contenham a primeira palavra ou expressão informada mas que não contenham a segunda palavra ou expressão informada.&lt;br&gt;Ex.: crime não &quot;sonegação fiscal&quot;">não</button>

                        <button class="px-2 btn btn-sm btn-secondary" data-html="true" data-placement="top" data-toggle="tooltip" data-trigger="hover" onclick="adicionarOperador(' prox ');" title="" type="button" data-original-title="Pesquisa documentos onde as palavras ou expressões informadas encontram-se próximas no texto.&lt;br&gt;Ex.: aposentadoria prox contribuição">prox</button>

                        <button class="px-2 btn btn-sm btn-secondary" data-html="true" data-placement="top" data-toggle="tooltip" data-trigger="hover" onclick="adicionarOperador(' &quot; *&quot;');" title="" type="button" data-original-title="Pesquisa documentos que contenham o início da palavra ou expressão informada.&lt;br&gt;Ex.: &quot;embarg*&quot; (retornará registros com as palavras embargo, embargou, embargante)">*</button>

                    </div>
