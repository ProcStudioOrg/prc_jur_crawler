<form id="form-pesquisa-repercussao-geral" name="form" action="listarProcesso.asp" method="post">
								<div class="container-formulario">
									<div class="row equal">
										<div class="col-md-2 col-xs-12 secao-formulario">
											<div>Pesquisa por:</div>
										</div>
										<div class="col-md-10 col-xs-12">
											<div class="row equal">
												<div class="col-md-8 col-xs-12">
													<label for="situacaoRG">Situação do Tema de Repercussão Geral:</label>
													<select name="situacaoRG" id="situacaoRG" class="form-control input-sm form-select">
														<option value="TODAS">Todas</option>
														<option value="ACORDAO_MERITO_PUBLICADO">Acórdão de Mérito Publicado</option>
														<option value="ACORDAO_REPERCUSSAO_GERAL_PUBLICADO">Acórdão de Repercussão Geral Publicado</option>
														<option value="AGUARDA_SUBSTITUICAO_PARADIGMA">Aguarda Substituição de Paradigma</option>
														<option value="ANALISADA_PRELIMINAR">Analisada Preliminar de Repercussão Geral</option>
														<option value="CANCELADO">Cancelado</option>
														<option value="DESTACADO">Destacado</option>
														<option value="EM_JULGAMENTO">Em Julgamento</option>
														<option value="MERITO_JULGADO">Mérito Julgado</option>
														<option value="REVISADO">Revisado</option>
														<option value="TRANSITO_JULGADO">Trânsito em Julgado</option>
													</select>
												</div>
												<div class="col-md-2 col-xs-12" style="display: flex">
													<div style="align-self: flex-end" data-toggle="tooltip" title="A marcação desta caixa retorna apenas os tetmas que estejam na situação selecionada. Se a caixa estiver desmarcada, todos os temas que tenham passado pela situação escolhida serão retornados no resultado.">
														<input type="checkbox" name="situacaoAtual" id="situacaoAtual" value="S" checked="">
														<label for="situacaoAtual" style="margin-bottom: 0px">Situação Atual</label>
													</div>
												</div>
											</div>
											<div class="row m-t-8">
												<div class="col-md-8 col-xs-12">
													<label for="txtTituloTema">Palavra Chave:</label>
													<input name="txtTituloTema" id="txtTituloTema" class="form-control input-sm" value="">
													<div class="btn-group btn-group-sm operadores m-t-8" role="group" aria-label="">
														<button type="button" class="btn" data-operador="e" title="Operador &lt;strong&gt;E&lt;/strong&gt;" data-content="Procura todas as palavras desejadas em qualquer lugar do documento. &lt;br&gt;&lt;br&gt;&lt;strong&gt;Ex:&lt;/strong&gt; &quot;ICMS E SUBSTITUIÇÃO&quot;">e</button>
														<button type="button" class="btn" data-operador="ou" title="Operador &lt;strong&gt;OU&lt;/strong&gt;" data-content="Procura por qualquer uma das palavras. Pode utilizar o parênteses para combinar a pesquisa com outros operadores. &lt;br&gt;&lt;br&gt;&lt;strong&gt;Ex.:&lt;/strong&gt; aposentadoria e (deputado ou parlamentar ou congressista)">ou</button>
														<button type="button" class="btn" data-operador="adj" title="Operador &lt;strong&gt;ADJ&lt;/strong&gt;" data-content="Busca palavras aproximadas, na mesma ordem colocada na expressão de busca. &lt;br&gt;&lt;br&gt;&lt;strong&gt;Ex:&lt;/strong&gt; MINISTÉRIO adj2 PÚBLICO e TEMPO adj2 SERVIÇO (O número após o &quot;ADJ&quot; indica delimitação de distância entre palavras, podendo ser escolhido livremente).">adj</button>
														<button type="button" class="btn" data-operador="nao" title="Operador &lt;strong&gt;NÃO&lt;/strong&gt;" data-content="Recupera documentos que contenham a primeira, mas não a segunda palavra. &lt;br&gt;&lt;br&gt;&lt;strong&gt;Ex:&lt;/strong&gt; Parlamentar não penal">não</button>
														<button type="button" class="btn" data-operador="prox" title="Operador &lt;strong&gt;PROX&lt;/strong&gt;" data-content="Procura palavras aproximadas em qualquer ordem. &lt;br&gt;&lt;br&gt;&lt;strong&gt;Ex.:&lt;/strong&gt; extraordinário prox5 admissibilidade. (O número após o &quot;PROX&quot; indica delimitação de distância entre palavras, podendo ser escolhido livremente).">prox</button>
														<button type="button" class="btn" data-operador="mesmo" title="Operador &lt;strong&gt;MESMO&lt;/strong&gt;" data-content="Operador utilizado para pesquisar no mesmo parágrafo; sua utilização principal é para pesquisa no campo legislação. &lt;br&gt;&lt;br&gt;&lt;strong&gt;Ex:&lt;/strong&gt; aposentadoria mesmo parlamentar (Obs.: Consulte o Ajuda para pesquisa por legislação na base de Súmulas).">mesmo</button>
														<button type="button" class="btn" data-operador="$" title="Operador &lt;strong&gt;$&lt;/strong&gt;" data-content="Este operador substitui qualquer parte da palavra desejada, ou seja, prefixo, radical ou sufixo. &lt;br&gt;&lt;br&gt;&lt;strong&gt;Ex.:&lt;/strong&gt; $constitucional$ / militar$ / octavio ga$otti">$</button>
													</div>
												</div>
												<div class="col-md-4 col-xs-12 moz-arrow-button">

												</div>
											</div>
										</div>
									</div>
